<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <!-- Créer et mettre un logo -->
        <nav class="nav">
            <a href="">Accueil</a>
            <a href="">A propos</a>
            <a href="">Projets</a>
            <a href="">Contact</a>
        </nav>
    </header>
    <main>
        <section class="form-contact">
            <div class="form-block">
                <p class="form-info">
                    Veuillez remplir le formulaire si vous avez une demande ou un projet en tête.
                </p>
                <form class="form-body" action="">
                    <label for="name">Nom</label>
                    <input type="text" name="name" id="name" class="input-name" required>
                    <label for="email">E-mail</label>
                    <input type="email" name="email" id="email" class="input-email">
                    <label for="subject">Sujet</label>
                    <input type="text" name="subject" id="subject" class="input-subject" required>
                    <label for="message"></label>
                    <textarea name="message" id="message" class="textarea-message" required>Message</textarea>
                    <div class="btn-position">
                        <button class="btn-form">Envoyer</button>
                    </div>
                </form>
            </div>
            <div class="contact-block">
                <p class="contact-info">Contact</p>
                <div class="contact-element">
                    <img src="/img-contact/" alt="mail">
                    <p>pucet.raphael@hotmail.fr</p>
                </div>
                <div class="contact-element">
                    <img src="" alt="phone">
                    <p>08.88.84.51.85</p>
                </div>
                <div class="contact-element"> 
                    <img src="" alt="localisation">
                    <p>51 La Cornillère, Roz-Landrieux</p>
                </div>
                <div class="contact-element">
                    <img src="" alt="instagram">
                    <p>Lien Instagram</p>
                </div>
                <div class="contact-element">
                    <img src="" alt="linkedin">
                    <p>Lien linkedin</p>
                </div>
            </div>
        </section>
    </main>
    <footer class="footer">
        <!-- Mettre logos liens sociaux linkedin et instagram (en créer un pro') -->
        <div class="footer-p">
            <p>R.Pucet - Tout droits réservés</p>
        </div>
    </footer>
</body>

</html>
